services:
  verify:
    image: mcr.microsoft.com/dotnet/sdk:10.0.403@sha256:de4fe90a98845d75910b9769662465c84de1a934665c431279d1382b2bddc02b
    profiles: [verify]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - monitoring_service_nuget:/tmp/nuget
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      NUGET_PACKAGES: /tmp/nuget
      MONITORING_CAMERA_ID: "${MONITORING_CAMERA_ID:-garage-01}"
      MONITORING_SPOOL_DIRECTORY: "${MONITORING_SPOOL_DIRECTORY:-/spool}"
      MONITORING_STATUS_STALE_SECONDS: "${MONITORING_STATUS_STALE_SECONDS:-20}"
      MONITORING_CAPTURE_ENABLED: "${MONITORING_CAPTURE_ENABLED:-false}"
      MONITORING_CAPTURE_SEGMENT_SECONDS: "${MONITORING_CAPTURE_SEGMENT_SECONDS:-5}"
      MONITORING_CAPTURE_MAX_SEGMENTS: "${MONITORING_CAPTURE_MAX_SEGMENTS:-120}"
      MONITORING_CAPTURE_MAX_SEGMENT_BYTES: "${MONITORING_CAPTURE_MAX_SEGMENT_BYTES:-67108864}"
      MONITORING_EVENT_JOURNAL_MAX_EVENTS: "${MONITORING_EVENT_JOURNAL_MAX_EVENTS:-10000}"
      MONITORING_EVENT_JOURNAL_MAX_BYTES: "${MONITORING_EVENT_JOURNAL_MAX_BYTES:-67108864}"
      MONITORING_ANALYSIS_QUEUE_CAPACITY: "${MONITORING_ANALYSIS_QUEUE_CAPACITY:-8}"
      MONITORING_ANALYSIS_LEASE_SECONDS: "${MONITORING_ANALYSIS_LEASE_SECONDS:-60}"
      MONITORING_ANALYSIS_DEFAULT_VERSION: "${MONITORING_ANALYSIS_DEFAULT_VERSION:-analysis-v1}"
      MONITORING_ANALYSIS_ENABLED: "${MONITORING_ANALYSIS_ENABLED:-false}"
      MONITORING_ANALYSIS_POLL_SECONDS: "${MONITORING_ANALYSIS_POLL_SECONDS:-5}"
      MONITORING_ANALYSIS_MAX_FRAMES: "${MONITORING_ANALYSIS_MAX_FRAMES:-12}"
      MONITORING_ANALYSIS_MAX_ATTEMPTS: "${MONITORING_ANALYSIS_MAX_ATTEMPTS:-2}"
      MONITORING_ANALYSIS_SAMPLE_FPS: "${MONITORING_ANALYSIS_SAMPLE_FPS:-1}"
      MONITORING_FFMPEG_PATH: "${MONITORING_FFMPEG_PATH:-ffmpeg}"
      MONITORING_DETECTOR_ONNX_MODEL_PATH: "${MONITORING_DETECTOR_ONNX_MODEL_PATH:-}"
      MONITORING_DETECTOR_MODEL_VERSION: "${MONITORING_DETECTOR_MODEL_VERSION:-detector-v1}"
      MONITORING_DETECTOR_INPUT_NAME: "${MONITORING_DETECTOR_INPUT_NAME:-images}"
      MONITORING_DETECTOR_OUTPUT_NAME: "${MONITORING_DETECTOR_OUTPUT_NAME:-output0}"
      MONITORING_DETECTOR_INPUT_WIDTH: "${MONITORING_DETECTOR_INPUT_WIDTH:-640}"
      MONITORING_DETECTOR_INPUT_HEIGHT: "${MONITORING_DETECTOR_INPUT_HEIGHT:-640}"
      MONITORING_DETECTOR_SCORE_THRESHOLD: "${MONITORING_DETECTOR_SCORE_THRESHOLD:-0.35}"
      MONITORING_DETECTOR_LABELS: "${MONITORING_DETECTOR_LABELS:-}"
      MONITORING_DETECTOR_INTRA_OP_THREADS: "${MONITORING_DETECTOR_INTRA_OP_THREADS:-1}"
      MONITORING_DETECTOR_INTER_OP_THREADS: "${MONITORING_DETECTOR_INTER_OP_THREADS:-1}"
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    command: bash -lc 'dotnet restore HomeIaMonitoring.slnx --locked-mode && dotnet format HomeIaMonitoring.slnx --verify-no-changes --no-restore && dotnet test HomeIaMonitoring.slnx --configuration Release --no-restore'

volumes:
  monitoring_service_nuget:
